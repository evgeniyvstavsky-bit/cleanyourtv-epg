name: CleanYourTV EPG Daily Update

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "17 1 * * *"
    - cron: "43 13 * * *"

permissions:
  contents: read

concurrency:
  group: cleanyourtv-epg-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate and validate compact EPG
        run: python generate.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload EPG site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish HTTPS EPG
        id: deployment
        uses: actions/deploy-pages@v4
