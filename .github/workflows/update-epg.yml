name: CleanYourTV EPG Daily Update

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: cleanyourtv-epg-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.iptvx.outputs.ready }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate and validate compact EPG
        run: python generate.py

      - name: Add verified IPTVX schedules (retry; never publish incomplete EPG)
        id: iptvx
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "IPTVX attempt $attempt/3"
            if python iptvx-addon.py; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "IPTVX passed; complete EPG ready to publish." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "::warning::IPTVX failed validation after 3 attempts; publishing validated base EPG."
          echo "IPTVX unavailable/invalid: publishing validated base EPG without IPTVX additions." >> "$GITHUB_STEP_SUMMARY"


      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload EPG site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish HTTPS EPG
        id: deployment
        uses: actions/deploy-pages@v4
